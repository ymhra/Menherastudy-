<style>
:root{--ink:#12304a;--paper:#fff;--muted:#eef3f6;--line:#cbd5dc}*{box-sizing:border-box}body{margin:0;padding:0 0 76px;background:var(--paper);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}header{padding:14px 16px;border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:12px}h1{font-size:21px;margin:0;flex:1}h2{font-size:20px;margin:18px 0 12px}h3{font-size:17px;margin:10px 0}main{max-width:780px;margin:auto;padding:14px}button,input,select,textarea{font:inherit;border:1px solid var(--ink);border-radius:0;padding:10px;background:white;color:var(--ink);max-width:100%}button{cursor:pointer}button.primary{background:var(--ink);color:white}.full{width:100%;margin:5px 0}.hidden{display:none!important}.muted{background:var(--muted);padding:12px}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:#fff;border-top:2px solid var(--ink);z-index:10}.bottom-nav button{width:33.33%;border:0;padding:13px 3px}.bottom-nav button.active{background:var(--ink);color:white;font-weight:bold}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}.small{font-size:13px;color:#536777}.iconbtn{width:48px;height:48px;min-width:48px;padding:0;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 48px;line-height:0;box-sizing:border-box;appearance:none;-webkit-appearance:none}.settings-button{aspect-ratio:1;overflow:hidden}.settings-button svg{display:block;width:30px;height:30px;flex:0 0 30px;overflow:hidden;box-sizing:border-box}.info-button{border:0;background:transparent;padding:2px 5px;color:var(--ink);font-size:19px;line-height:1}.info-popover{position:fixed;z-index:50;left:50%;top:78px;transform:translateX(-50%);width:min(320px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);box-shadow:0 4px 18px #0002;padding:14px}.info-popover p{margin:8px 0 12px;font-size:14px;line-height:1.6}.info-popover button{border:0;padding:5px 0;text-decoration:underline}.hour-scroller{scroll-snap-type:x mandatory;scroll-padding-inline:calc(50% - 39px);-webkit-overflow-scrolling:touch}.hour-item{scroll-snap-align:center;flex:0 0 78px}.hour-item.active{outline:2px solid var(--ink);outline-offset:-2px}.scan-fab{position:fixed;right:18px;bottom:88px;width:58px;height:58px;border:0;border-radius:50%;background:var(--ink);color:white;z-index:8;font-size:25px}.card{border-top:1px solid var(--line);padding:13px 0}.category-management,.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.toolbar button{flex:1}.date-switch{display:flex;gap:8px}.date-switch button{flex:1}.date-switch button.active{background:var(--ink);color:white}.hour-scroller{display:flex;overflow-x:auto;gap:0;padding:8px 0;scroll-padding-inline:0;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.hour-spacer{flex:0 0 max(0px,calc(50vw - 39px));width:max(0px,calc(50vw - 39px));pointer-events:none}.hour-item{min-width:78px;text-align:center;padding:12px 6px;border:0;border-bottom:1px solid var(--line)}.hour-item.active{background:var(--ink);color:white}.timeline{display:flex;flex-direction:column;gap:0;margin:12px 0 12px 26px;padding:0 0 0 22px;border-left:4px solid var(--ink);position:relative}.entry{position:relative;flex:0 0 auto;width:100%;min-width:0;max-width:100%;padding:14px 8px 14px 18px;border:0;border-left:5px solid var(--cat-color);border-bottom:1px solid var(--line);margin:0;overflow-wrap:anywhere}.entry:before{content:"";position:absolute;left:-34px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--cat-color)}.entry-time{font-size:15px;color:#536777}.entry-name{font-size:18px;font-weight:bold;margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.record-category{margin-left:auto;font-size:14px;font-weight:normal;color:var(--cat-color);white-space:nowrap}.record-more{border:0;background:transparent;padding:0 3px;font-size:20px;color:var(--ink);line-height:1}.record-gap{font-size:13px;color:#536777;padding:7px 0 7px 18px;border-bottom:1px dashed var(--line)}.memo{font-size:14px;color:#536777;margin-top:5px;white-space:pre-wrap}.qr-image{margin:10px 0}.archive-item{padding:14px 8px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.archive-item span{flex:1}.path{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.path button{flex:1;min-width:0}.path .archive-crumb{height:auto;min-height:58px;padding:8px 3px;white-space:normal;overflow-wrap:anywhere}.path .archive-crumb:disabled{visibility:hidden}.print-choice{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.scan-modal{padding:0!important;align-items:stretch!important;justify-content:stretch!important}.scan-modal .panel{width:100%;max-width:none;height:100vh;height:100dvh;max-height:100vh;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:8px;gap:4px}.scan-modal h2{margin:4px 0 8px}.scan-modal .scan-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.scan-modal .scan-options button{margin:0;padding:9px 3px;font-size:14px;min-height:44px}.scan-modal #scannerArea{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.scan-modal #scanVideo{width:100%;height:100%;min-height:0;object-fit:contain;flex:1}.scan-modal #scanMessage{margin:2px 0;font-size:11px;line-height:1.2;flex:0 0 auto}.scan-modal .full{margin:2px 0;padding:8px}.scan-modal .scan-options button.selected{background:var(--ink);color:white}.panel{background:white;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px}.panel input,.panel textarea,.panel select{width:100%;margin:5px 0}.report{border:1px solid var(--line);padding:14px;margin:12px 0}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.report-list{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.report-title{font-size:20px;font-weight:bold}.report-total{font-size:30px;font-weight:bold;margin:4px 0 12px}.report-duration{font-size:20px;font-weight:bold;white-space:nowrap}.report-memo{font-size:13px;color:#536777;min-height:18px;white-space:pre-wrap}.info-text{background:var(--muted);padding:12px;margin:8px 0}.danger{border-color:#8b1e1e;color:#8b1e1e}.hidden{display:none!important}
@media(max-width:560px){.report-grid{grid-template-columns:1fr}.report-duration{font-size:19px}}
@media print{body{padding:0}.bottom-nav,header,button,.no-print{display:none!important}main{max-width:none;padding:0}.report{border:0;margin:0;padding:0}}

.entry{--cat-color:var(--ink);border-left:3px solid var(--cat-color);padding-left:14px;margin-left:-3px}
.entry:before{background:var(--cat-color)}
.entry-name{display:flex;align-items:center;justify-content:flex-start;gap:6px;cursor:pointer;flex-wrap:wrap}
.entry-name .record-title{flex:1 1 auto;min-width:0}
.entry-name .record-category{font-size:12px;font-weight:normal;color:var(--cat-color);white-space:nowrap;margin-left:auto}.record-more{width:28px;min-width:28px;padding:0;border:0;font-size:18px;line-height:1;background:transparent;color:var(--ink)}.record-menu{margin-top:6px}.record-menu button{padding:6px 10px;font-size:14px}

</style></head><body>
<header><h1>QR記録アプリ</h1><button class="iconbtn settings-button" onclick="openSettings()" aria-label="設定を開く" title="設定"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></svg></button></header><main>
<section id="currentPage"><div class="row"><h2>記録</h2><button class="info-button" onclick="showInfo('current')" title="記録の説明" aria-label="記録の説明">ⓘ</button><div class="grow"></div><button onclick="openDailyReport()" title="振り返りシート">▤</button></div>

<div class="date-switch"><button id="todayBtn" onclick="setDateOffset(0)">今日</button><button id="yesterdayBtn" onclick="setDateOffset(-1)">昨日</button></div>
<div class="row"><p id="selectedDateLabel" class="grow"></p><strong id="studyTotal"></strong></div><div id="hourScroller" class="hour-scroller"></div><div id="currentRecords"></div></section>
<section id="pastPage" class="hidden"><div class="row"><h2>過去の記録</h2><button class="info-button" onclick="showInfo('past')" aria-label="過去の記録の説明">ⓘ</button></div><div id="archivePath" class="path"></div><div id="archiveList"></div><div id="archiveDetail"></div></section>
<section id="qrPage" class="hidden"><div class="row"><h2>QRコード作成</h2><button class="info-button" onclick="showInfo('qr')" aria-label="QRコード作成の説明">ⓘ</button><div class="grow"></div><button onclick="showPastQRs()">過去のQRコード</button></div>
<input id="qrName" placeholder="QRコードの名前" class="full"><label>分類</label><div class="row"><select id="qrCategory" class="grow"></select><button onclick="openCategoryEditor()" style="white-space:nowrap">編集</button></div><button class="primary full" onclick="createQR()">作成</button><button class="full" onclick="openPrintSelection()">印刷</button><div id="printSelection" class="hidden"><h3>印刷するQRコードを選ぶ（最大10個）</h3><button class="full" onclick="selectLatest10()">最新の10個を選択する</button><div id="printChoices"></div><button class="primary full" onclick="printSelectedQRs()">選んだQRコードを印刷</button><button class="full" onclick="closePrintSelection()">戻る</button><button class="full" onclick="showPastQRs()">過去のQRコード</button></div><div id="qrList"></div></section>

<section id="settingsPage" class="hidden"><h2>設定</h2><h3>データの管理</h3><p class="small">バックアップはJSON形式でiPhoneの「ファイル」に保存できます。</p><h3>保存容量</h3><p id="storageInfo" class="small">保存容量を確認しています…</p><button class="full" onclick="refreshStorageInfo()">保存容量を更新</button><button class="primary full" onclick="backupData()">バックアップを作成する</button><button class="full" onclick="restoreData()">バックアップから復元する</button><input type="file" id="restoreFile" accept=".json,application/json" class="hidden" onchange="restoreFromFile(event)"><button class="full" onclick="exportExcel()">Excel形式で記録を出力する</button><button class="danger full" onclick="openEraseMenu()">データを消去する</button><button class="full" onclick="closeSettings()">閉じる</button></section>
</main><button id="scanFab" class="scan-fab" onclick="openScanMode()" aria-label="QRコードを読み取る" title="QRコードを読み取る"><svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7V5h2M17 5h2v2M19 17v2h-2M7 19H5v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 9h2v2H9zM13 9h2v2h-2zM9 13h2v2H9zM13 13h2"/></svg></button>
<nav class="bottom-nav"><button id="pastTab" onclick="switchPage('past')">過去の記録</button><button id="currentTab" class="active" onclick="switchPage('current')">記録</button><button id="qrTab" onclick="switchPage('qr')">QRコード作成</button></nav>
<div id="eraseModal" class="modal hidden"><div class="panel"><h2>データの消去</h2><p class="danger"><strong>注意：消去したデータは元に戻せません。必要なデータは先にバックアップしてください。</strong></p><p>消去する内容を選んでください。</p><button class="danger full" onclick="eraseDataFlow('all')">すべてのデータを全消去</button><button class="danger full" onclick="eraseDataFlow('qrs')">QRコードのデータを全消去</button><button class="danger full" onclick="eraseDataFlow('today')">今日の記録を全消去</button><button class="danger full" onclick="eraseDataFlow('past')">過去の記録を全消去</button><button class="full" onclick="closeEraseMenu()">キャンセル</button></div></div>
<div id="infoPopover" class="info-popover hidden" role="dialog" aria-live="polite"><div class="row"><strong id="infoTitle"></strong><div class="grow"></div><button onclick="closeInfo()" aria-label="閉じる">閉じる</button></div><p id="infoContent"></p></div><div id="modal" class="modal hidden"><div class="panel" id="modalPanel"></div></div>
<div id="scanModal" class="modal scan-modal hidden"><div class="panel"><h2>QRコードを読み取る</h2><div class="scan-options"><button data-scanmode="record" onclick="startScanner('record')">記録する</button><button data-scanmode="search" onclick="startScanner('search')">探す</button><button data-scanmode="edit" onclick="startScanner('edit')">名前・分類を変更</button></div><div id="scannerArea" class="hidden"><video id="scanVideo" playsinline></video><p id="scanMessage"></p></div><button class="full" onclick="closeScanner()">閉じる</button></div></div>
<script>
const DB_NAME='QRRecordDB',DB_VERSION=1,STORE='appData';let db,scanMode=null,cameraStream=null,scanLoop=null,settingsReturnPage='current',qrPastReturnPage='qr',selectedDate=new Date(),selectedHour=new Date().getHours(),archiveYear=null,archiveMonth=null,archiveWeek=null,archiveDay=null,showingPastQR=false;
const DEFAULT_CATEGORIES=['勉強','起床','就寝'];let state={qrs:[],logs:[],categories:[...DEFAULT_CATEGORIES]};
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbGet(key){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result?.value);r.onerror=()=>reject(r.error)})}
function dbSet(key,value){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({key,value});tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function readViewState(){try{return JSON.parse(localStorage.getItem('qr_view_state')||'{}')}catch{return {}}}
function persistViewState(){try{const pastQRVisible=!document.getElementById('qrPastPage')?.classList.contains('hidden');const settingsVisible=!document.getElementById('settingsPage')?.classList.contains('hidden');const visibleMain=['current','past','qr'].find(p=>!document.getElementById(p+'Page')?.classList.contains('hidden'));const page=pastQRVisible?'qrPast':(settingsVisible?'settings':(visibleMain||currentPage||'current'));const v={page,settingsReturnPage,qrPastReturnPage,selectedDate:dateKey(selectedDate),selectedHour,archiveYear,archiveMonth,archiveWeek,archiveDay,showingPastQR,qrFilters:{search:document.getElementById('qrSearch')?.value||'',category:document.getElementById('qrCategoryFilter')?.value||'',printed:document.getElementById('qrPrintFilter')?.value||'',sort:document.getElementById('qrSort')?.value||''}};localStorage.setItem('qr_view_state',JSON.stringify(v));}catch(e){}}
let currentPage='current';
async function initDB(){db=await openDB();let old=localStorage.getItem('qr_items');if(old&&!await dbGet('qrs')){state.qrs=JSON.parse(old||'[]');state.logs=JSON.parse(localStorage.getItem('qr_logs')||'[]');state.categories=JSON.parse(localStorage.getItem('qr_categories')||'null')||DEFAULT_CATEGORIES;await saveState();}state.qrs=await dbGet('qrs')||[];state.logs=await dbGet('logs')||[];state.categories=await dbGet('categories')||[...DEFAULT_CATEGORIES];let v=readViewState();if(v.selectedDate)selectedDate=parseDate(v.selectedDate);if(Number.isInteger(v.selectedHour))selectedHour=v.selectedHour;archiveYear=v.archiveYear??null;archiveMonth=v.archiveMonth??null;archiveWeek=v.archiveWeek??null;archiveDay=v.archiveDay??null;settingsReturnPage=v.settingsReturnPage||'current';qrPastReturnPage=v.qrPastReturnPage||'qr';let page=v.page||'current';if(!['current','past','qr','settings','qrPast'].includes(page))page='current';currentPage=page==='qrPast'?'qr':page;renderCategories();renderCurrent();renderArchive();showQRs();const scanId=new URLSearchParams(location.search).get('scan');if(scanId){checkURL();}else if(page==='qrPast'){currentPage='qr';switchPage('qr');showPastQRs();}else{switchPage(page);}if(v.qrFilters){for(const [id,val] of [['qrSearch',v.qrFilters.search],['qrCategoryFilter',v.qrFilters.category],['qrPrintFilter',v.qrFilters.printed],['qrSort',v.qrFilters.sort]]){let el=document.getElementById(id);if(el&&val)el.value=val;}if(page==='qrPast')renderQRList(pastQRs(),'qrPastList','過去のQRコード');else if(page==='qr')showQRs();}}
async function saveState(){await Promise.all([dbSet('qrs',state.qrs),dbSet('logs',state.logs),dbSet('categories',state.categories)])}
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parseDate=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const addDays=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const fmtDate=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;const monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
function switchPage(p){currentPage=p;document.getElementById('qrPastPage').classList.add('hidden');['current','past','qr','settings'].forEach(x=>document.getElementById(x+'Page')?.classList.toggle('hidden',x!==p));['current','past','qr'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('active',x===p));document.getElementById('scanFab').classList.toggle('hidden',p!=='current');if(p==='current')renderCurrent();if(p==='past')renderArchive();if(p==='qr')showQRs();persistViewState();}
function openToday(){selectedDate=new Date();selectedDate.setHours(0,0,0,0);selectedHour=new Date().getHours()}
function setDateOffset(n){selectedDate=addDays(new Date(),n);selectedDate.setHours(0,0,0,0);selectedHour=new Date().getHours();renderCurrent()}
function renderCurrent(){document.getElementById('selectedDateLabel').textContent=fmtDate(selectedDate);document.getElementById('todayBtn').classList.toggle('active',dateKey(selectedDate)===dateKey(new Date()));document.getElementById('yesterdayBtn').classList.toggle('active',dateKey(selectedDate)===dateKey(addDays(new Date(),-1)));let hs=document.getElementById('hourScroller');if(hs.querySelectorAll('.hour-item').length!==24){hs.innerHTML='';let start=document.createElement('span');start.className='hour-spacer';hs.appendChild(start);for(let h=0;h<24;h++){let b=document.createElement('button');b.className='hour-item';b.dataset.hour=h;b.textContent=h+'時';b.onclick=()=>selectHour(h,true);hs.appendChild(b)}let end=document.createElement('span');end.className='hour-spacer';hs.appendChild(end)}updateHourButtons();requestAnimationFrame(()=>{let active=hs.querySelector('.active');if(active)hs.scrollLeft=active.offsetLeft+active.offsetWidth/2-hs.clientWidth/2});renderHourRecords();document.getElementById('studyTotal').textContent='勉強 '+formatDuration(getStudyTotal(dateKey(selectedDate)));}
function updateHourButtons(){document.querySelectorAll('#hourScroller .hour-item').forEach(el=>el.classList.toggle('active',Number(el.dataset.hour)===selectedHour))}
function renderHourRecords(){let logs=state.logs.filter(x=>x.date===dateKey(selectedDate)&&new Date(x.timestamp).getHours()===selectedHour).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));renderTimeline(document.getElementById('currentRecords'),logs)}
function selectHour(h,centerItem=false){selectedHour=h;updateHourButtons();renderHourRecords();if(centerItem){let item=document.querySelector(`#hourScroller .hour-item[data-hour="${h}"]`);if(item){let sc=document.getElementById('hourScroller');sc.scrollTo({left:item.offsetLeft+item.offsetWidth/2-sc.clientWidth/2,behavior:'smooth'})}}}
let hourScrollFrame=0;document.getElementById('hourScroller').addEventListener('scroll',()=>{if(hourScrollFrame)return;hourScrollFrame=requestAnimationFrame(()=>{hourScrollFrame=0;const sc=document.getElementById('hourScroller');const itemWidth=78;const spacer=Math.max(0,window.innerWidth/2-39);const centerPos=sc.scrollLeft+sc.clientWidth/2-spacer;const h=Math.max(0,Math.min(23,Math.round((centerPos-39)/itemWidth)));if(h!==selectedHour){selectedHour=h;updateHourButtons();renderHourRecords()}})},{passive:true});

function categoryColor(category){
 if(category==='起床')return '#c62828';
 if(category==='就寝')return '#7b3fb4';
 if(category==='勉強')return '#42b6d8';
 return '#12304a';
}
function renderTimeline(el,logs){
 el.innerHTML='';let h=document.createElement('h3');h.textContent=selectedHour+'時';el.appendChild(h);
 if(!logs.length){el.append('この時間の記録はありません。');return}
 const allSorted=[...state.logs].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
 let tl=document.createElement('div');tl.className='timeline';
 logs.forEach((log,index)=>{
  const color=categoryColor(log.category);let e=document.createElement('div');e.className='entry';e.style.setProperty('--cat-color',color);
  let t=document.createElement('div');t.className='entry-time';t.textContent=new Date(log.timestamp).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  let n=document.createElement('div');n.className='entry-name';let title=document.createElement('span');title.className='record-title';title.textContent=log.name;
  let more=document.createElement('button');more.className='record-more';more.textContent='∴';more.title='記録のメニュー';more.setAttribute('aria-label','記録のメニュー');
  let cat=document.createElement('span');cat.className='record-category';cat.textContent=log.category||'未分類';n.append(title,more,cat);
  let memo=document.createElement('div');memo.className='memo';memo.textContent=log.memo||'';
  let editMemo=document.createElement('div');editMemo.className='hidden';let input=document.createElement('textarea');input.className='entry-memo-editor';input.placeholder='メモを入力';input.value=log.memo||'';

// 日付をまたぐ記録の扱い：翌日の最初が「起床」なら、前日の最後のQRを仮想的な「就寝」として扱う。
function isFirstLogOfDay(log, logs){
 const d=dateKey(new Date(log.timestamp));
 return !logs.some(x=>dateKey(new Date(x.timestamp))===d && new Date(x.timestamp)<new Date(log.timestamp));
}
function isLastLogOfDay(log, logs){
 const d=dateKey(new Date(log.timestamp));
 return !logs.some(x=>dateKey(new Date(x.timestamp))===d && new Date(x.timestamp)>new Date(log.timestamp));
}
function effectiveNextLog(logs,index){
 const current=logs[index], next=logs[index+1];
 if(!current||!next)return next||null;
 // 前日の最後が翌日の最初の「起床」につながる場合、前日の最後を就寝として扱い、
 // その時点で直前の活動を終了する（翌朝まで勉強時間を伸ばさない）。
 if(isLastLogOfDay(current,logs) && isFirstLogOfDay(next,logs) && next.category==='起床') return {...current, timestamp:current.timestamp, _virtualSleepBoundary:true};
 return next;
}
function getStudyTotal(day){
 const logs=[...state.logs].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
 const dayStart=new Date(day+'T00:00:00').getTime(),dayEnd=dayStart+24*60*60*1000;
 let total=0;
 for(let i=0;i<logs.length;i++){
  const start=logs[i];if(start.category!=='勉強')continue;
  const next=effectiveNextLog(logs,i);
  if(!next)continue;
  const a=new Date(start.timestamp).getTime(),b=new Date(next.timestamp).getTime();
  if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a)continue;
  // セッションが日付をまたいだ場合は、対象日の範囲に重なる時間だけを計上する
  const overlap=Math.max(0,Math.min(b,dayEnd)-Math.max(a,dayStart));
  total+=overlap/60000;
 }
 return Math.round(total)
}function formatDuration(min){let h=Math.floor(min/60),m=Math.round(min%60);return h?`${h}時間${m?m+'分':''}`:`${m}分`}

      const idx=allLogs.findIndex(z=>z.logId===item.logId);
      const prev=idx>0?allLogs[idx-1]:null;
      const isStudyEnd=prev&&prev.category==='勉強'&&item.category!=='勉強';
      const label=item.category==='勉強'?item.name:(isStudyEnd?item.category:(item.name||item.category));
      const color=item.category==='起床'?'#c62828':item.category==='就寝'?'#7b3fb4':'#12304a';
      ctx.font=`bold ${labelFont}px sans-serif`;
      const text=minute+'分 '+label;
      const measured=ctx.measureText(text).width;
      const rightSide=pos+5+measured<=x+w;
      const tx=rightSide?pos+5:pos-5;
      const align=rightSide?'left':'right';
      const left=rightSide?tx:tx-measured;
      const right=rightSide?tx+measured:tx;
      return {item,minute,pos,text,color,left,right,width:measured,tx,align};
    });
    // レーンは「実際の文字幅＋余白」で判定。詰め込み過ぎず、ラベルが多い日は行高を増やす。
    const lanes=[];
    for(const item of labelItems){
      let lane=0;
      while(lanes[lane] && lanes[lane].some(r=>item.left<r.right+8&&item.right>r.left-8))lane++;
      if(!lanes[lane])lanes[lane]=[];
      lanes[lane].push(item);item.lane=lane;
    }
    const rowH=Math.max(baseHourH,16+Math.max(1,lanes.length)*laneH);
    // 睡眠時間帯を紫色で塗る。
    for(const [a,b] of darkRanges){
      const aa=Math.max(a,hStart),bb=Math.min(b,hEnd);
      if(bb>aa){const left=plotX+(aa-hStart)/3600000*plotW,width=(bb-aa)/3600000*plotW;ctx.fillStyle='#7b3fb4';ctx.fillRect(left,rowY,Math.max(0,width),rowH);}
    }
    // 勉強時間は薄い水色で、時間ごとの行に分割して塗る。
    for(const seg of studyIntervals){
      const aa=Math.max(seg.start,hStart),bb=Math.min(seg.end,hEnd);
      if(bb>aa){const left=plotX+(aa-hStart)/3600000*plotW,width=(bb-aa)/3600000*plotW;ctx.fillStyle=colorStudy;ctx.fillRect(left,rowY+4,Math.max(2,width),rowH-8);}
    }
    const rowDark=darkRanges.some(([a,b])=>a<=hStart&&b>hStart);
    ctx.fillStyle=rowDark?'#ffffff':'#12304a';ctx.font='bold 21px sans-serif';ctx.textAlign='left';ctx.fillText(hour+'時',x,rowY+7);
    // 記録が多い時間帯は行の高さを自動で広げ、ラベルを上下にずらして表示。
    for(const item of labelItems){
      const textY=rowY+6+item.lane*laneH;
      ctx.fillStyle=item.color;
      ctx.beginPath();ctx.arc(item.pos,textY+5,3,0,Math.PI*2);ctx.fill();
      ctx.font=`bold ${labelFont}px sans-serif`;ctx.textAlign=item.align;
      ctx.fillText(item.text,item.tx,textY);
      ctx.textAlign='left';
    }
    ctx.strokeStyle='#cbd5dc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,rowY+rowH);ctx.lineTo(x+w,rowY+rowH);ctx.stroke();
    rowY+=rowH;
  }
  ctx.fillStyle='#12304a';ctx.textAlign='left';return rowY;
 }
 if(vertical){let y=drawLeft(margin,y0,colW);drawRight(margin,y+28,colW)}else{drawLeft(margin,y0,colW);drawRight(margin+colW+gap,y0,colW)}
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob){alert('PNG画像を作成できませんでした。');return}
 shareOrSave(blob,`振り返り_${day}_${vertical?'縦型':'A4'}.png`,'振り返りシート');closeModal()
}

async function refreshStorageInfo(){
 const el=document.getElementById('storageInfo');if(!el)return;
 if(!navigator.storage||!navigator.storage.estimate){el.textContent='このブラウザでは保存容量の確認に対応していません。';return}
 try{const {usage=0,quota=0}=await navigator.storage.estimate();const remaining=Math.max(0,quota-usage);const fmt=n=>n<1024?`${n} B`:n<1024**2?`${(n/1024).toFixed(1)} KB`:`${(n/1024**2).toFixed(2)} MB`;
 const remainingPercent=quota>0?Math.max(0,Math.min(100,remaining/quota*100)):0;
 const usedPercent=quota>0?Math.max(0,Math.min(100,usage/quota*100)):0;
 el.textContent=`使用中：約${fmt(usage)}（${usedPercent.toFixed(1)}%） ／ 保存可能な目安：約${fmt(quota)} ／ 残り：約${fmt(remaining)}（${remainingPercent.toFixed(1)}%）（ブラウザ全体の目安）`;
 }catch(e){el.textContent='保存容量を取得できませんでした。'}
}

async function eraseDataFlow(kind){
 const info={all:{title:'すべてのデータ',warning:'QRコード・記録・分類をすべて消去します。アプリのデータがほぼ初期状態に戻ります。'},qrs:{title:'QRコードのデータ',warning:'登録したQRコードをすべて消去します。QRコード自体は復元できません。過去の記録に残る名称などは消えません。'},today:{title:'今日の記録',warning:'今日の日付の記録だけをすべて消去します。'},past:{title:'過去の記録',warning:'今日より前の日付の記録をすべて消去します。'}}[kind];
 if(!info)return;
 const phrase=kind==='all'?'すべて消去':kind==='qrs'?'QRコード消去':kind==='today'?'今日の記録消去':'過去の記録消去';
 alert('【重要・取り消し不可】'+info.warning+'\n\n誤操作防止のため、これから確認を2回行います。');
 if(!confirm('確認 1/2\n本当に「'+info.title+'」を消去しますか？\n\nこの操作は元に戻せません。'))return;
 const typed=prompt('確認 2/2\n消去を実行する場合、次の言葉をそのまま入力してください。\n\n「'+phrase+'」');
 if(typed!==phrase){alert('入力が一致しなかったため、消去を中止しました。');return;}
 if(kind==='all'){
   if(!confirm('最終確認\nQRコード・全記録・分類をすべて消去します。バックアップはありますか？\n本当に実行しますか？'))return;
   state.qrs=[];state.logs=[];state.categories=[...DEFAULT_CATEGORIES];
 }else if(kind==='qrs'){
   state.qrs=[];
 }else if(kind==='today'){
   const today=dateKey(new Date());state.logs=state.logs.filter(x=>x.date!==today);
 }else if(kind==='past'){
   const today=dateKey(new Date());state.logs=state.logs.filter(x=>x.date>=today);
 }
 await saveState();renderCategories();renderCurrent();renderArchive();showQRs();
 if(currentPage==='qrPast')renderQRList(pastQRs(),'qrPastList','過去のQRコード');
 closeEraseMenu();alert('「'+info.title+'」の消去が完了しました。');
}

async function restoreFromFile(e){let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data.qrs||!data.logs||!data.categories)throw Error('invalid');if(!confirm('現在のデータをバックアップ内容に置き換えます。復元前に現在のデータをバックアップしましたか？'))return;let old={qrs:state.qrs,logs:state.logs,categories:state.categories};let blob=new Blob([JSON.stringify({...old,backupDate:new Date().toISOString()},null,2)],{type:'application/json'});shareOrSave(blob,`復元前バックアップ_${dateKey(new Date())}.json`,'復元前バックアップ');state.qrs=data.qrs;state.logs=data.logs;state.categories=data.categories;await saveState();renderCategories();renderCurrent();showQRs();alert('復元しました。')}catch(err){alert('バックアップファイルを読み込めませんでした。')}e.target.value=''}
function exportExcel(){if(!window.XLSX)return alert('Excel出力ライブラリを読み込めませんでした。インターネット接続を確認してください。');let wb=XLSX.utils.book_new();let byMonth={};state.logs.forEach(x=>{let m=x.date.slice(0,7);(byMonth[m]??=[]).push(x)});Object.keys(byMonth).sort().forEach(m=>{let rows=[['日付','時刻','QRコード名','分類','メモ']];byMonth[m].sort((a,b)=>a.timestamp.localeCompare(b.timestamp)).forEach(x=>rows.push([x.date,new Date(x.timestamp).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),x.name,x.category||'未分類',x.memo||'']));let ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:14},{wch:10},{wch:28},{wch:14},{wch:40}];XLSX.utils.book_append_sheet(wb,ws,m.replace('-','年')+'月')});if(!Object.keys(byMonth).length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['記録はありません']]),'記録');let bytes=XLSX.write(wb,{bookType:'xlsx',type:'array'});shareOrSave(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`QR記録_${dateKey(new Date())}.xlsx`,'Excel記録')}
function openModal(){document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openScanMode(){document.getElementById('scanModal').classList.remove('hidden')}function closeScanner(){stopCamera();document.getElementById('scanModal').classList.add('hidden');document.getElementById('scannerArea').classList.add('hidden');switchPage('current')}
async function startScanner(mode){scanMode=mode;document.querySelectorAll('[data-scanmode]').forEach(b=>b.classList.toggle('selected',b.dataset.scanmode===mode));document.getElementById('scannerArea').classList.remove('hidden');let msg=document.getElementById('scanMessage');try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});let v=document.getElementById('scanVideo');v.srcObject=cameraStream;await v.play();if(!('BarcodeDetector'in window)){msg.textContent='このブラウザは画面内QR読み取りに対応していません。スマホのカメラで読み取ってください。';return}let detector=new BarcodeDetector({formats:['qr_code']});let tick=async()=>{if(!cameraStream)return;try{let codes=await detector.detect(v);if(codes.length){let id=null;try{id=new URL(codes[0].rawValue).searchParams.get('scan')}catch{}if(id){stopCamera();closeScanner();if(scanMode==='record')recordScan(id);else if(scanMode==='search')findLastRecord(id);else editQR(id)}else msg.textContent='このQRコードはアプリのものではありません。';return}}catch{}scanLoop=requestAnimationFrame(tick)};tick()}catch(e){msg.textContent='カメラを起動できませんでした。カメラの使用を許可してください。'}}function stopCamera(){if(scanLoop)cancelAnimationFrame(scanLoop);scanLoop=null;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}let v=document.getElementById('scanVideo');if(v)v.srcObject=null}
async function recordScan(id){let q=state.qrs.find(x=>x.id===id&&!x.deleted);if(!q){alert('このQRコードは削除済み、または登録されていません。');return}let category=q.category;if(!state.categories.includes(category)){category=await chooseMissingCategory(q);if(!category)return;q.category=category;await saveState()}let memo='';let now=new Date();state.logs.push({logId:crypto.randomUUID(),id:q.id,name:q.name,category,timestamp:now.toISOString(),date:dateKey(now),memo:memo||''});await saveState();selectedDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());selectedHour=now.getHours();switchPage('current');renderCurrent()}
function chooseMissingCategory(q){return new Promise(resolve=>{let p=document.getElementById('modalPanel');let opts=state.categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');p.innerHTML=`<h2>分類を設定してください</h2><p>QRコード「${escapeHtml(q.name)}」に登録されていた分類が現在存在しません。過去の記録は変更されていません。</p><label>既存の分類から選ぶ</label><select id="missingCategorySelect"><option value="">分類を選択</option>${opts}</select><label>または、新しい分類を入力</label><input id="missingCategoryInput" placeholder="新しい分類名"><button class="primary full" id="missingCategorySave">分類を設定して記録する</button><button class="full" id="missingCategoryCancel">キャンセル</button>`;openModal();document.getElementById('missingCategorySave').onclick=async()=>{let chosen=document.getElementById('missingCategorySelect').value;let typed=document.getElementById('missingCategoryInput').value.trim();let val=typed||chosen;if(!val)return alert('分類を選択するか、入力してください。');if(typed&&!state.categories.some(c=>c.toLocaleLowerCase()===typed.toLocaleLowerCase())){state.categories.push(typed);await saveState();renderCategories()}else if(typed){val=state.categories.find(c=>c.toLocaleLowerCase()===typed.toLocaleLowerCase())}closeModal();resolve(val)};document.getElementById('missingCategoryCancel').onclick=()=>{closeModal();resolve(null)}})}
function findLastRecord(id){let logs=state.logs.filter(x=>x.id===id).sort((a,b)=>b.timestamp.localeCompare(a.timestamp));if(!logs.length)return alert('このQRコードの記録はまだありません');let d=new Date(logs[0].timestamp);selectedDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());selectedHour=d.getHours();switchPage('current');renderCurrent()}
function checkURL(){let id=new URLSearchParams(location.search).get('scan');if(id){recordScan(id);history.replaceState(null,'',location.pathname)}}
function renderArchive(){
 const path=document.getElementById('archivePath'),list=document.getElementById('archiveList'),detail=document.getElementById('archiveDetail');
 path.innerHTML='';list.innerHTML='';detail.innerHTML='';
 // Breadcrumb is always four fixed slots: year / month / week / day.
 const labels=[archiveYear||'',archiveMonth?(archiveMonth.slice(5)+'月'):'',archiveWeek||'',archiveDay?(archiveDay.slice(8)+'日'):''];
 const actions=[
  ()=>{archiveYear=null;archiveMonth=null;archiveWeek=null;archiveDay=null;renderArchive()},
  ()=>{if(!archiveYear)return;archiveMonth=null;archiveWeek=null;archiveDay=null;renderArchive()},
  ()=>{if(!archiveMonth)return;archiveWeek=null;archiveDay=null;renderArchive()},
  ()=>{if(!archiveWeek)return;archiveDay=null;renderArchive()}
 ];
 labels.forEach((label,i)=>{let b=document.createElement('button');b.textContent=label;b.className='archive-crumb';b.disabled=!label;b.onclick=actions[i];path.appendChild(b)});
 const years=[...new Set(state.logs.map(x=>x.date.slice(0,4)))].sort().reverse();
 if(!archiveYear){years.forEach(y=>addArchiveItem(list,y,()=>{archiveYear=y;archiveMonth=null;archiveWeek=null;archiveDay=null;renderArchive()}));return;}
 if(!archiveMonth){let months=[...new Set(state.logs.filter(x=>x.date.startsWith(archiveYear)).map(x=>x.date.slice(0,7)))].sort().reverse();months.forEach(m=>addArchiveItem(list,m.slice(5)+'月',()=>{archiveMonth=m;archiveWeek=null;archiveDay=null;renderArchive()}));return;}
 const monthLogs=state.logs.filter(x=>x.date.startsWith(archiveMonth));let weekMap={};monthLogs.forEach(x=>{let d=parseDate(x.date),s=addDays(d,-((d.getDay()+6)%7)),e=addDays(s,6),key=String(s.getDate()).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0');(weekMap[key]??=[]).push(x.date)});
 if(!archiveWeek){Object.keys(weekMap).sort((a,b)=>a.localeCompare(b)).forEach(w=>addArchiveItem(list,w,()=>{archiveWeek=w;archiveDay=null;renderArchive()}));return;}
 if(!archiveDay){[...new Set(weekMap[archiveWeek]||[])].sort().forEach(d=>addArchiveItem(list,d.slice(8)+'日',()=>{archiveDay=d;renderArchive()}));return;}
 // Day selected: show only this day's records; clear the date-choice list so other days don't linger.
 let logs=state.logs.filter(x=>x.date===archiveDay).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
 logs.forEach(x=>{let div=document.createElement('div');div.className='card';div.textContent=new Date(x.timestamp).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'　'+x.name+'（'+x.category+'）'+(x.memo?'\nメモ：'+x.memo:'');detail.appendChild(div)});
 let txt=logs.map(x=>new Date(x.timestamp).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' '+x.name+'（'+x.category+'）'+(x.memo?' メモ:'+x.memo:'')).join('\n');let b=document.createElement('button');b.className='primary full';b.textContent='この日の記録をテキスト保存';b.onclick=()=>shareOrSave(new Blob([archiveDay+'\n'+txt],{type:'text/plain;charset=utf-8'}),archiveDay+'.txt','記録テキスト');detail.appendChild(b)
}
