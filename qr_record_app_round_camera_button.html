<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR記録アプリ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#12304a;--paper:#fff;--muted:#eef3f6;--line:#cbd5dc}
.category-management{display:flex;gap:8px;margin:8px 0 14px}
.category-management input{min-width:0;flex:1}
.scan-launch{position:sticky;top:0;z-index:5}
select{font:inherit;border:1px solid var(--ink);border-radius:0;padding:11px;background:white;color:var(--ink)}
.scan-fab{position:fixed;right:18px;bottom:94px;width:58px;height:58px;border:0;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.22);z-index:15;padding:0}
.scan-fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.entry-name{border-left:5px solid var(--ink);padding-left:8px}
.entry-name.study{border-color:#f28c28}
.entry-name.routine{border-color:#d92332}
.scan-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.scan-panel{background:white;color:var(--ink);width:100%;max-width:520px;padding:18px}
#scanVideo{width:100%;max-height:55vh;background:#111;object-fit:cover}

*{box-sizing:border-box}
body{margin:0;padding-bottom:78px;background:var(--paper);color:var(--ink);font:16px sans-serif}
header{padding:16px 18px;border-bottom:1px solid var(--ink)}
h1{font-size:22px;margin:0} h2{font-size:20px;margin:22px 0 12px} h3{font-size:17px}
main{max-width:760px;margin:auto;padding:16px}
button,input{font:inherit;border:1px solid var(--ink);border-radius:0;padding:11px;background:#fff;color:var(--ink)}
button{cursor:pointer} .primary{background:var(--ink);color:#fff}
.full{width:100%;margin:6px 0}.hidden{display:none!important}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:white;border-top:2px solid var(--ink);z-index:10}
.bottom-nav button{width:33.333%;border:0;padding:14px 4px;background:white;color:var(--ink)}
.bottom-nav button.active{background:var(--ink);color:white;font-weight:bold}
.scroller{display:flex;overflow-x:auto;gap:6px;padding:8px 0 12px;scrollbar-width:thin}
.scroller button{flex:0 0 auto;min-width:86px}
.scroller button.active{background:var(--ink);color:white}
.hour-scroller{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;padding:12px calc(50% - 50px);scrollbar-width:thin}
.hour-item{flex:0 0 100px;text-align:center;padding:14px 8px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--ink);scroll-snap-align:center;font-size:16px}
.hour-item.active{font-weight:bold;background:var(--ink);color:#fff}
.archive-item{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:15px 10px;cursor:pointer}
.archive-item:before{content:"▤";font-size:20px;flex:0 0 24px}
.archive-item span{flex:1}
.archive-item small{color:#536777}
.date-choice{display:flex;gap:8px;margin:10px 0}
.date-choice button{flex:1}
.timeline{border-left:2px solid var(--ink);margin:12px 0 12px 12px;padding-left:18px}
.entry{position:relative;padding:10px 0}
.entry:before{content:"";position:absolute;left:-24px;top:17px;width:10px;height:10px;background:var(--ink);border-radius:50%}
.entry-time{font-size:14px;color:#536777}
.entry-name{font-size:18px;font-weight:bold;margin-top:3px}
.interval{font-size:14px;color:#536777;padding:4px 0 4px 18px}
.notice{background:var(--muted);padding:12px;margin:10px 0}
.qr-item,.archive-item{border-top:1px solid var(--line);padding:14px 0}
.qr-image{margin:12px 0}
.archive-path{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.archive-path button{flex:1;min-width:90px}
.text-record{white-space:pre-wrap;background:var(--muted);padding:12px;font-family:monospace}
</style>
</head>
<body>
<header><h1>QR記録アプリ</h1></header>
<main>
<section id="currentPage">
  <h2>記録</h2>
  <div id="scanResult" class="notice hidden"></div>

  <p id="selectedDateLabel"></p>
  <div class="hour-scroller" id="hourScroller"></div>
  <div id="currentRecords"></div>
</section>

<section id="pastPage" class="hidden">
  <h2>過去の記録</h2>
  <p>フォルダーを開くように、月・週・日を順番に開いて記録を確認できます。</p>
  <div class="archive-path" id="archivePath"></div>
  <div id="archiveList"></div>
  <div id="archiveDetail"></div>
</section>

<section id="qrPage" class="hidden">
  <h2>QRコードを作る</h2>
  <input id="qrName" class="full" placeholder="名前（例：英単語帳、机）">
  <label for="qrCategory">分類</label>
  <select id="qrCategory" class="full"></select>
  <div class="category-management">
    <input id="newCategoryName" placeholder="新しい分類名">
    <button onclick="addCategory()">分類を追加</button>
  </div>
  <button class="primary full" onclick="createQR()">QRコードを作成</button>
  <button class="full" onclick="openPrintSelection()">印刷する</button>
  <section id="printSelection" class="hidden">
    <h3>印刷するQRコードを選ぶ（最大10個）</h3>
    <p>選んだQRコードをA4用紙に10枠で印刷します。選ばなかった枠は空白になります。</p>
    <div id="printChoices"></div>
    <button class="primary full" onclick="printSelectedQRs()">選んだQRコードを印刷</button>
    <button class="full" onclick="closePrintSelection()">戻る</button>
  </section>
  <div id="qrList"></div>
</section>
</main>

<button id="scanFab" class="scan-fab hidden" aria-label="QRコードを読み取る" title="QRコードを読み取る" onclick="openScanMode()">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
</button>
<nav class="bottom-nav">
  <button id="pastTab" onclick="switchPage('past')">過去の記録</button>
  <button id="currentTab" class="active" onclick="switchPage('current')">記録</button>
  <button id="qrTab" onclick="switchPage('qr')">QRコード作成</button>
</nav>

<div id="printSheet"></div>
<div id="scanModal" class="scan-modal hidden">
  <div class="scan-panel">
    <h2>QRコードを読み取る</h2>
    <p>読み取ったQRコードをどうしますか？</p>
    <button class="primary full" onclick="startScanner('search')">探す</button>
    <button class="primary full" onclick="startScanner('record')">記録する</button>
    <button class="full" onclick="closeScanner()">キャンセル</button>
    <div id="scannerArea" class="hidden">
      <video id="scanVideo" playsinline></video>
      <p id="scanMessage">QRコードをカメラに映してください。</p>
      <button class="full" onclick="stopCamera()">カメラを止める</button>
    </div>
  </div>
</div>
<script>
const QR_KEY="qr_items", LOG_KEY="qr_logs", CATEGORY_KEY="qr_categories";
const DEFAULT_CATEGORIES=["勉強","起床","就寝"];
let scanMode=null, cameraStream=null, scanLoop=null;
function getCategories(){
  const saved=JSON.parse(localStorage.getItem(CATEGORY_KEY)||"null");
  return saved||DEFAULT_CATEGORIES;
}
function saveCategories(items){localStorage.setItem(CATEGORY_KEY,JSON.stringify(items))}
function renderCategories(){
  const select=document.getElementById("qrCategory");if(!select)return;
  const current=select.value;select.innerHTML="";
  getCategories().forEach(name=>{const op=document.createElement("option");op.value=name;op.textContent=name;select.appendChild(op)});
  if(getCategories().includes(current))select.value=current;
}
function addCategory(){
  const input=document.getElementById("newCategoryName"),name=input.value.trim();
  if(!name){alert("分類名を入力してください。");return}
  const cats=getCategories();if(cats.includes(name)){alert("その分類はすでにあります。");return}
  cats.push(name);saveCategories(cats);input.value="";renderCategories();
}
let selectedMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let selectedDate=new Date();
let selectedHour=new Date().getHours();
let archiveMonth=null, archiveWeek=null, archiveDay=null;

function getQRs(){
  const items=JSON.parse(localStorage.getItem(QR_KEY)||"[]");
  const now=Date.now();
  const alive=items.filter(item=>item.createdAt && now-new Date(item.createdAt).getTime()<60*60*1000);
  if(alive.length!==items.length)localStorage.setItem(QR_KEY,JSON.stringify(alive));
  return alive.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}
function getLogs(){return JSON.parse(localStorage.getItem(LOG_KEY)||"[]")}
function saveQRs(x){localStorage.setItem(QR_KEY,JSON.stringify(x))}
function saveLogs(x){localStorage.setItem(LOG_KEY,JSON.stringify(x))}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function sameDay(a,b){return dateKey(a)===dateKey(b)}
function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function monthLabel(d){return d.getFullYear()+"年"+(d.getMonth()+1)+"月"}
function fmtDate(d){return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function switchPage(page){
  ["current","past","qr"].forEach(p=>document.getElementById(p+"Page").classList.toggle("hidden",p!==page));
  ["current","past","qr"].forEach(p=>document.getElementById(p+"Tab").classList.toggle("active",p===page));
  document.getElementById("scanFab").classList.toggle("hidden",page!=="current");
  if(page==="current"){openToday();renderCurrent();}
  if(page==="past")renderArchive();
  if(page==="qr")showQRs();
}

function openToday(){
  const d=new Date();
  selectedDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  selectedMonth=new Date(d.getFullYear(),d.getMonth(),1);
  selectedHour=d.getHours();
}
function chooseTodayYesterday(offset){
  const d=addDays(new Date(),offset);
  selectedDate=d;selectedMonth=new Date(d.getFullYear(),d.getMonth(),1);
  renderCurrent();
}
function renderCurrent(){
  const today=new Date();
  const yesterday=addDays(today,-1);
  const dateText=sameDay(selectedDate,today) ? "今日（"+fmtDate(selectedDate)+"）"
    : sameDay(selectedDate,yesterday) ? "昨日（"+fmtDate(selectedDate)+"）"
    : fmtDate(selectedDate);
  document.getElementById("selectedDateLabel").textContent=dateText;
  const hours=document.getElementById("hourScroller");
  if(!hours.dataset.ready){
    hours.innerHTML="";
    for(let h=0;h<24;h++){
      const item=document.createElement("div");
      item.className="hour-item";
      item.dataset.hour=h;
      item.textContent=h+"時";
      hours.appendChild(item);
    }
    hours.dataset.ready="1";
    hours.addEventListener("scroll",()=>{
      const center=hours.getBoundingClientRect().left+hours.clientWidth/2;
      let nearest=null, distance=Infinity;
      [...hours.children].forEach(el=>{
        const r=el.getBoundingClientRect();
        const d=Math.abs((r.left+r.width/2)-center);
        if(d<distance){distance=d;nearest=el;}
      });
      if(nearest){
        const h=Number(nearest.dataset.hour);
        if(h!==selectedHour){
          selectedHour=h;
          [...hours.children].forEach(el=>el.classList.toggle("active",Number(el.dataset.hour)===h));
          renderSelectedHour();
        }
      }
    });
  }
  [...hours.children].forEach(el=>el.classList.toggle("active",Number(el.dataset.hour)===selectedHour));
  const target=hours.querySelector('[data-hour="'+selectedHour+'"]');
  if(target)hours.scrollLeft=target.offsetLeft-(hours.clientWidth-target.clientWidth)/2;
  renderSelectedHour();
}
function renderSelectedHour(){
  renderTimeline(document.getElementById("currentRecords"),
    getLogs().filter(x=>x.date===dateKey(selectedDate)&&new Date(x.timestamp).getHours()===selectedHour));
}
function renderTimeline(container,logs){
  container.innerHTML="";
  logs.sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  const heading=document.createElement("h3");heading.textContent=selectedHour+"時";
  container.appendChild(heading);
  if(!logs.length){container.textContent="この時間の記録はありません。";return}
  const timeline=document.createElement("div");timeline.className="timeline";
  logs.forEach((log,i)=>{
    const d=new Date(log.timestamp);
    const entry=document.createElement("div");entry.className="entry";
    const time=document.createElement("div");time.className="entry-time";
    time.textContent=":"+String(d.getMinutes()).padStart(2,"0");
    const name=document.createElement("div");name.className="entry-name";
    const category=log.category||"";
    if(category==="勉強")name.classList.add("study");
    if(category==="起床"||category==="就寝")name.classList.add("routine");
    name.textContent=log.name+"（"+(category||"未分類")+"）";
    entry.append(time,name);timeline.appendChild(entry);
    const next=logs[i+1];
    if(next&&next.id===log.id){
      const diff=Math.round((new Date(next.timestamp)-d)/60000);
      const gap=document.createElement("div");gap.className="interval";
      gap.textContent="│ "+diff+" min";timeline.appendChild(gap);
    }
  });
  container.appendChild(timeline);
}

// QR generation
function createQR(){
  const name=document.getElementById("qrName").value.trim();
  if(!name){alert("名前を入力してください。");return}
  const items=getQRs();const id=crypto.randomUUID();
  const category=document.getElementById("qrCategory").value||"未分類";
  items.push({id,name,category,createdAt:new Date().toISOString()});saveQRs(items);
  document.getElementById("qrName").value="";showQRs();
}
function showQRs(){
  const list=document.getElementById("qrList");list.innerHTML="";
  getQRs().forEach(item=>{
    const div=document.createElement("div");div.className="qr-item";
    const title=document.createElement("h3");title.textContent=item.name+"（"+(item.category||"未分類")+"）";
    const qr=document.createElement("div");qr.className="qr-image";
    const url=new URL(location.href);url.search="";url.hash="";url.searchParams.set("scan",item.id);
    new QRCode(qr,{text:url.href,width:200,height:200});
    const save=document.createElement("button");save.className="primary full";save.textContent="QRコードを画像で保存";
    save.onclick=()=>{
      const canvas=qr.querySelector("canvas"),img=qr.querySelector("img");
      const a=document.createElement("a");a.href=canvas?canvas.toDataURL("image/png"):img.src;
      a.download=item.name+".png";a.click();
    };
    const del=document.createElement("button");del.className="full";del.textContent="QRコードを削除";
    del.onclick=()=>{if(confirm("削除しますか？")){saveQRs(getQRs().filter(x=>x.id!==item.id));showQRs()}};
    div.append(title,qr,save,del);list.appendChild(div);
  });
}

function openPrintSelection(){
  const section=document.getElementById("printSelection");
  section.classList.remove("hidden");
  const choices=document.getElementById("printChoices");choices.innerHTML="";
  const items=getQRs();
  if(!items.length){choices.textContent="印刷できるQRコードがありません。";return}
  items.forEach(item=>{
    const label=document.createElement("label");label.className="print-choice";
    const cb=document.createElement("input");cb.type="checkbox";cb.value=item.id;
    cb.addEventListener("change",()=>{
      const checked=[...choices.querySelectorAll("input:checked")];
      if(checked.length>10){cb.checked=false;alert("選べるQRコードは最大10個です。")}
    });
    const text=document.createElement("span");text.textContent=item.name+"（作成 "+new Date(item.createdAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+"）";
    label.append(cb,text);choices.appendChild(label);
  });
}
function closePrintSelection(){document.getElementById("printSelection").classList.add("hidden")}
async function printSelectedQRs(){
  const selected=[...document.querySelectorAll("#printChoices input:checked")].slice(0,10);
  const items=getQRs();
  const chosen=selected.map(cb=>items.find(x=>x.id===cb.value)).filter(Boolean);
  const W=1240,H=1754,canvas=document.createElement("canvas");
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  const margin=48,gap=24,cellW=(W-margin*2-gap)/2,cellH=(H-margin*2-gap*4)/5;
  const qrSize=Math.min(cellW-50,cellH-110),qrImages=[];
  for(const item of chosen){
    const temp=document.createElement("div");
    const u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("scan",item.id);
    new QRCode(temp,{text:u.href,width:400,height:400});
    const q=temp.querySelector("canvas"),img=temp.querySelector("img");
    qrImages.push({item,dataUrl:q?q.toDataURL("image/png"):img?.src});
  }
  for(let i=0;i<10;i++){
    const col=i%2,row=Math.floor(i/2),x=margin+col*(cellW+gap),y=margin+row*(cellH+gap);
    ctx.strokeStyle="#bbb";ctx.lineWidth=2;ctx.strokeRect(x,y,cellW,cellH);
    if(qrImages[i]){
      const {item,dataUrl}=qrImages[i],img=new Image();
      await new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;img.src=dataUrl});
      const qx=x+(cellW-qrSize)/2,qy=y+24;
      ctx.drawImage(img,qx,qy,qrSize,qrSize);
      ctx.fillStyle="#12304a";ctx.font="bold 32px sans-serif";ctx.textAlign="center";
      ctx.fillText(item.name+"（"+(item.category||"未分類")+"）",x+cellW/2,qy+qrSize+48,cellW-24);
    }
  }
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
  if(!blob){alert("印刷用データを作成できませんでした。");return}
  const file=new File([blob],"QRコード_A4.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
    try{await navigator.share({files:[file],title:"QRコード A4印刷用"})}
    catch(err){if(err.name!=="AbortError")alert("共有できませんでした。画像を保存して共有してください。")}
  }else{
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="QRコード_A4.png";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alert("共有メニューに対応していないため、A4画像を保存しました。画像を共有メニューから印刷アプリへ送ってください。");
  }
}
// Record scan from QR URL
function recordScan(id){
  const item=getQRs().find(q=>q.id===id);
  const result=document.getElementById("scanResult");result.classList.remove("hidden");
  if(!item){result.textContent="このQRコードは登録されていません。この端末でQRを作成したブラウザを使ってください。";return}
  const now=new Date();
  const logs=getLogs();
  logs.push({id:item.id,name:item.name,category:item.category||"未分類",timestamp:now.toISOString(),date:dateKey(now)});
  saveLogs(logs);
  result.textContent=item.name+" を "+now.toLocaleString("ja-JP")+" に記録しました。";
  selectedDate=now;selectedMonth=new Date(now.getFullYear(),now.getMonth(),1);selectedHour=now.getHours();
  renderCurrent();
}

// Past records: month > week > day
function renderArchive(){
  const path=document.getElementById("archivePath");path.innerHTML="";
  const list=document.getElementById("archiveList");list.innerHTML="";
  const detail=document.getElementById("archiveDetail");detail.innerHTML="";
  const logs=getLogs();
  const months=[...new Set(logs.map(x=>x.date.slice(0,7)))].sort().reverse();

  if(!archiveMonth){
    months.forEach(m=>{
      const b=document.createElement("div");b.className="archive-item";b.innerHTML="<span>"+m.replace("-","年")+"月</span><small>開く ›</small>";
      b.onclick=()=>{archiveMonth=m;archiveWeek=null;archiveDay=null;renderArchive()};
      list.appendChild(b);
    });
    if(!months.length)list.textContent="過去の記録はありません。";
    return;
  }
  addPathButton(path,"月一覧",()=>{archiveMonth=null;archiveWeek=null;archiveDay=null;renderArchive()});
  addPathButton(path,archiveMonth,()=>{archiveWeek=null;archiveDay=null;renderArchive()});

  const monthLogs=logs.filter(x=>x.date.startsWith(archiveMonth));
  const days=[...new Set(monthLogs.map(x=>x.date))].sort();
  const weeks={};
  days.forEach(day=>{
    const d=parseDate(day);
    const start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7)); // Monday
    const end=addDays(start,6);
    const key=dateKey(start)+"〜"+dateKey(end);
    (weeks[key]??=[]).push(day);
  });

  if(!archiveWeek){
    Object.keys(weeks).forEach(w=>{
      const b=document.createElement("div");b.className="archive-item";b.innerHTML="<span>"+w+"</span><small>開く ›</small>";
      b.onclick=()=>{archiveWeek=w;archiveDay=null;renderArchive()};
      list.appendChild(b);
    });
    return;
  }
  addPathButton(path,archiveWeek,()=>{archiveWeek=null;archiveDay=null;renderArchive()});
  weeks[archiveWeek].forEach(day=>{
    const b=document.createElement("div");b.className="archive-item";b.innerHTML="<span>"+day+" の記録</span><small>開く ›</small>";
    b.onclick=()=>{archiveDay=day;renderArchive()};
    list.appendChild(b);
  });

  if(!archiveDay)return;
  addPathButton(path,archiveDay,()=>{archiveDay=null;renderArchive()});
  const dayLogs=logs.filter(x=>x.date===archiveDay).sort((a,b)=>a.timestamp.localeCompare(b.timestamp));
  const text=dayLogs.map(x=>{
    const d=new Date(x.timestamp);
    return d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+"　"+x.name;
  }).join("\n");
  const pre=document.createElement("div");pre.className="text-record";pre.textContent=text||"記録はありません。";
  detail.appendChild(pre);
  const save=document.createElement("button");save.className="primary full";save.textContent="この日の記録をテキスト保存";
  save.onclick=()=>{
    const blob=new Blob([archiveDay+"\n"+text+"\n"],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=archiveDay+".txt";a.click();URL.revokeObjectURL(a.href);
  };
  detail.appendChild(save);
}
function addPathButton(parent,label,fn){const b=document.createElement("button");b.textContent=label;b.onclick=fn;parent.appendChild(b)}

function openScanMode(){document.getElementById("scanModal").classList.remove("hidden")}
function closeScanner(){stopCamera();document.getElementById("scanModal").classList.add("hidden")}
async function startScanner(mode){
  scanMode=mode;
  const area=document.getElementById("scannerArea");area.classList.remove("hidden");
  const msg=document.getElementById("scanMessage");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent="このブラウザではカメラを使えません。QRコードをスマホのカメラで読み取ってください。";
    return;
  }
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    const video=document.getElementById("scanVideo");video.srcObject=cameraStream;await video.play();
    if(!("BarcodeDetector" in window)){msg.textContent="このブラウザは画面内QR読み取りに対応していません。スマホのカメラでQRを読み取ってください。";return}
    const detector=new BarcodeDetector({formats:["qr_code"]});
    msg.textContent="QRコードをカメラに映してください。";
    const tick=async()=>{
      if(!cameraStream)return;
      try{
        const codes=await detector.detect(video);
        if(codes.length){
          const raw=codes[0].rawValue;
          let id=null;
          try{id=new URL(raw).searchParams.get("scan")}catch{}
          if(!id){msg.textContent="このアプリのQRコードではありません。";return}
          stopCamera();closeScanner();
          if(scanMode==="record")recordScan(id);
          else findLastRecord(id);
          return;
        }
      }catch{}
      scanLoop=requestAnimationFrame(tick);
    };
    tick();
  }catch(err){msg.textContent="カメラを起動できませんでした。カメラの使用を許可してください。"}
}
function stopCamera(){
  if(scanLoop)cancelAnimationFrame(scanLoop);scanLoop=null;
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
  const video=document.getElementById("scanVideo");if(video)video.srcObject=null;
}
function findLastRecord(id){
  const logs=getLogs().filter(x=>x.id===id).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  if(!logs.length){alert("このQRコードの記録はまだありません。");return}
  const log=logs[0],d=new Date(log.timestamp);
  selectedDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  selectedMonth=new Date(d.getFullYear(),d.getMonth(),1);selectedHour=d.getHours();
  switchPage("current");
  // switchPage resets to today, so restore the found date after changing tabs
  selectedDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());selectedHour=d.getHours();
  renderCurrent();
  document.getElementById("scanResult").classList.remove("hidden");
  document.getElementById("scanResult").textContent="「"+log.name+"」の最後の記録（"+d.toLocaleString("ja-JP")+"）を表示しています。";
}
function checkURL(){
  const id=new URLSearchParams(location.search).get("scan");
  if(id){recordScan(id);history.replaceState(null,"",location.pathname)}
}
function init(){renderCategories();openToday();renderCurrent();renderArchive();showQRs();checkURL()}
init();
</script>
